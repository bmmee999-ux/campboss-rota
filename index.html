<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ตารางเวรพนักงาน</title>
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#fbe4ec;--sf:#fff;--tx:#2a1320;--mu:#6e4a5b;--bd:#d98fae;--pr:#d6457f;--pt:#fff;--rd:#ffe0e0;--rt:#b91c1c;--gn:#dcfce7;--gt:#166534;--ch:#f8c8da;--hd:#fbb0be;--ht:#9f1239;--bn:#ffedd5;--bt:#9a3412;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1d1219;--sf:#2a1a24;--tx:#f7e7ef;--mu:#c79db1;--bd:#4b2f3e;--pr:#c2336b;--rd:#5c2028;--rt:#fca5a5;--gn:#14391f;--gt:#86efac;--ch:#3b2432;--hd:#6a2233;--ht:#fecdd3;--bn:#4a2a10;--bt:#fdba74}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1d1219;--sf:#2a1a24;--tx:#f7e7ef;--mu:#c79db1;--bd:#4b2f3e;--pr:#c2336b;--rd:#5c2028;--rt:#fca5a5;--gn:#14391f;--gt:#86efac;--ch:#3b2432;--hd:#6a2233;--ht:#fecdd3;--bn:#4a2a10;--bt:#fdba74}
*{box-sizing:border-box}html,body{height:auto}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Sarabun","Noto Sans Thai",system-ui,sans-serif}
#nav{display:flex;gap:6px;align-items:center;overflow-x:auto;background:linear-gradient(90deg,#ee6fa2,#d6457f);padding:10px 12px;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px rgba(214,69,127,.3)}
#nav .br{color:#fff;margin-right:8px;white-space:nowrap;font-size:16px}
#nav button{border:0;background:rgba(255,255,255,.2);color:#fff;padding:7px 14px;border-radius:999px;font:inherit;white-space:nowrap;cursor:pointer}
#nav button.on{background:#fff;color:var(--pr);font-weight:600}
main{padding:16px 20px;width:100%;max-width:none}
h2{margin:4px 0 12px;font-size:21px;color:var(--pr)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-bottom:12px}
.bar label{display:flex;flex-direction:column;font-size:12px;color:var(--mu)}
input,select,button.b{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:6px 9px}
button.b{cursor:pointer}button.p{background:linear-gradient(90deg,#ee6fa2,#d6457f);color:#fff;border-color:transparent}button.x{color:var(--rt)}
.w{overflow:auto;max-height:calc(100vh - 200px);min-height:260px;border:1px solid var(--bd);border-radius:12px;background:var(--sf);box-shadow:0 2px 10px rgba(214,69,127,.08)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{border:1px solid var(--bd);padding:6px 8px;vertical-align:top;text-align:left}
th{background:var(--pr);color:#fff;position:sticky;top:0;z-index:3;height:34px;box-shadow:inset 0 -1px var(--bd)}th.h2{top:34px;z-index:2}
td.d{background:var(--ch);white-space:nowrap;font-weight:600;min-width:104px}td.d small{display:block;color:var(--mu);font-weight:400}
td.td{box-shadow:inset 4px 0 var(--pr)}
tr.hd td{background:var(--hd);color:var(--ht)}tr.hd td.d{font-weight:700}tr.hd small{color:var(--ht)}tr.hd .chip{background:var(--sf);color:var(--tx)}tr.hd .chip.red{background:var(--rd);color:var(--rt)}
.chip{display:inline-flex;gap:4px;align-items:center;background:var(--ch);border-radius:999px;padding:2px 9px;margin:0 4px 4px 0;font-size:13px}
.chip.red,.red{background:var(--rd);color:var(--rt)}.chip.grn,.grn{background:var(--gn);color:var(--gt)}
.chip b{cursor:pointer;color:var(--mu)}.hdz{display:block;color:var(--mu);font-size:11px;margin-bottom:3px}
td select.hs{border:2px solid var(--pr);background:var(--ch);color:var(--ht);font-weight:700;font-size:14px;margin-bottom:6px}td select{width:100%;border-style:dashed;color:var(--mu);font-size:13px;padding:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px;box-shadow:0 2px 10px rgba(214,69,127,.08)}
.card .n{font-size:28px;font-weight:700;color:var(--pr)}.card small{color:var(--mu);display:block}
.card.red small,.card.grn small{color:inherit}
.tag{padding:1px 10px;border-radius:999px;font-size:12px;background:var(--ch)}.tag.red,.card.red{background:var(--rd);color:var(--rt)}.tag.grn,.card.grn{background:var(--gn);color:var(--gt)}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#3d2432;color:#fff;padding:8px 16px;border-radius:999px;display:none;z-index:9}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.chip.ban,.tag.ban,.card.ban,tr.ban td,tr.hd .chip.ban{background:var(--bn);color:var(--bt)}
@media print{#nav,.bar,td select,.chip b,.np{display:none!important}body{background:#fff}.w{overflow:visible;max-height:none;box-shadow:none}th{position:static}}
</style>
</head>
<body>
<div id="nav"></div>
<main id="main"></main>
<div id="toast"></div>
<script>
const R=[
['โอนเนอร์','นางอำไพ#ปลดเดือน 12/2026#2026-12-01,นางชมพู,นางวิไลลัก,นางลุ่น,นางเพ็ดมะนี,นางมุก,นางน้อย ทำมะวง#ลาคลอด##off,นางนาตาลี,นางตาตุ่น,นางต๋อกๆ,นางวันทิดา#ถือพา,นางจักสุก2,นางวิไลวอน,นางคำม่วน 1,นางลินทอง,นางวิไลพอน,นางคำม่วน 2,นางปานิตา,นางพอนทิบ#ปลดเดือน 12/2026#2026-12-01,นางมาลี,นางละหา#ปลดเดือน 12/2026#2026-12-01'],
['แคมป์2','นางแพงสี,นางเฮียง,นางมี,นางบัวพัน,นางมี้น,นางแอ,นางไมสี,นางทองสี,นางบุนนาก,นางกุ้งนาง,นางนางนี,นางน้ำหนื่ง,นางเพ็ดสะหมอน,นางตา สีหานาม,นางยุ้ย,นางลัก'],
['DC Camp','ท้าวเย็งยี่,ท้าวหนู ชง,ท้าววิไล ชง,ท้าวดาชง,ท้าวฮือ ชง,ท้าวบุนแก้ว,ท้าวบาเชย,ท้าวบี้,ท้าวฟีโน่,ท้าวทง ท่อ,ท้าวก้ง ชง,ท้าวบุน,ท้าวสุก,ท้าวพาด'],
['DC GB','ท้าวสุก,ท้าวสุลิวัน,ท้าวพาด,ท้าวโฟ่โด้,ท้าวสายสะหมอน,ท้าวทองขัน,ท้าวทองพัน,ท้าวสายทอง,ท้าวบุนทะวี GB,ท้าวบุนค้ำ,ท้าวแสงจะเลีน,ท้าวสุพิน,ท้าววันไช,ท้าวเต,ท้าวอุไท,ท้าวสมลัด'],
['แคมป์1','นางแต้ง,นางอำคา,นางคำหล้า,นางเลไล,นางกอน,นางบุนบาง,นางจอน,นางสีดา,นางแพง,นางจันสุก 1,นางต้อม,นางนุ้ย,นางปี่']];
const D=R.map(r=>r[0]);
const SH={m:{n:'กะเช้า (6:00-13:00)',g:['แคมป์2','แคมป์1'],h:7},a:{n:'กะบ่าย (13:00-20:00)',g:['โอนเนอร์','แคมป์1'],h:7},e:{n:'กะเย็น (16:00-22:00)',g:['DC Camp','DC GB'],h:6}};
const PO={T:['ด่านตลาด',2],N:['ด่านนาสั้ง',2],H:['ด่านห้วยย้อ',1]};
const S={kid:{n:'รายชื่อพนักงาน (15:30-18:00)',g:['แคมป์2','DC Camp'],h:2.5,q:()=>[0],qg:()=>[['แคมป์2',st.kidA||3],['DC Camp',st.kidB||2]]},gym:{n:'พนักงานประจำ (17:00-22:00)',g:['DC Camp'],h:5,q:()=>[1]},wash:{n:'รายชื่อพนักงาน',g:['โอนเนอร์','DC GB','แคมป์1'],h:2,days:[1,2,3,5,6],q:()=>[9,4]},rec:{n:'รายชื่อพนักงาน',g:['โอนเนอร์','แคมป์2','DC Camp','แคมป์1'],h:1,days:[1,2,3,4,5],q:w=>({1:[9,6],2:[7,4],3:[9,6],4:[9,6],5:[4,3]})[w]}};
const GR={mT:['แคมป์1'],mN:['แคมป์2'],mH:['แคมป์2'],aT:['โอนเนอร์','แคมป์1'],aN:['โอนเนอร์','แคมป์2'],aH:['โอนเนอร์','แคมป์2'],eT:['DC GB'],eN:['DC Camp','DC GB'],eH:['DC Camp','DC GB']};
const KS9=[];for(const sh in SH)for(const p in PO){S[sh+p]={n:PO[p][0],g:GR[sh+p],h:SH[sh].h,q:()=>[PO[p][1]],post:1,sh:sh};KS9.push(sh+p)}
S.mT.fb=['แคมป์2'];S.aT.qg=()=>[['โอนเนอร์',1],['แคมป์1',1]];
const HDR='<tr><th rowspan="2">วันที่</th>'+Object.values(SH).map(x=>'<th colspan="3">'+x.n+'</th>').join('')+'</tr><tr>'+Object.values(PO).map(x=>'<th class="h2">'+x[0]+'</th>').join('').repeat(3)+'</tr>';
const TH=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const TABS=[['ov','ภาพรวม'],['duty','เวรด่าน'],['gym','ยามโรงยิม'],['kid','ยามเด็กตลาด'],['wash','ล้างตลาด'],['rec','รับแลกขยะ'],['emp','พนักงาน'],['lv','วันลาพัก'],['ban','งดเวร'],['hol','วันหยุดบริษัท']];
const $=s=>document.querySelector(s);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dow=d=>new Date(d+'T00:00').getDay();
const fmt=d=>d.slice(8)+'/'+d.slice(5,7)+'/'+d.slice(0,4);
const today=iso(new Date());
let tab='ov',month=today.slice(0,7),perSlot=3,fd=today,ef=null,armed={},DB=null,tm;
function def(){const m=new Map();R.forEach(([g,s])=>s.split(',').forEach(x=>{const[n,note,end,off]=x.split('#');let e=m.get(n);if(!e){e={id:'e'+(m.size+1),code:'E'+String(m.size+1).padStart(3,'0'),name:n,dept:g,phone:'',status:off?'off':'on',note:note||'',end:end||''};m.set(n,e)}else e.dept+='/'+g}));return{emps:[...m.values()],leaves:[],sched:{}}}
function load(){try{const j=localStorage.getItem('rota');if(j)return JSON.parse(j)}catch(e){}return def()}
const DEFHL={T:['พอนทิบ','คำวิไล','ทิดาพอน'],N:['เสาแก้ว'],H:['สมสัก']};
function fixHl(){if(!st.hl||Array.isArray(st.hl))st.hl=JSON.parse(JSON.stringify(DEFHL));st.bans=st.bans||[];st.kidA=st.kidA||3;st.kidB=st.kidB||2}
let st=load();st.holidays=st.holidays||[];st.hnames=st.hnames||{};st.hd=st.hd||{};fixHl();
const SB_URL=((window.CONFIG||{}).URL||'').trim(),SB_KEY=((window.CONFIG||{}).KEY||'').trim();
const SB=SB_URL.startsWith('https://')&&SB_KEY.length>40;
const SBH={apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'};
const fix=()=>{st.holidays=st.holidays||[];st.hnames=st.hnames||{};st.hd=st.hd||{};fixHl()};
let pending=false,conn=false;
function save(){st._v=Date.now();try{localStorage.setItem('rota',JSON.stringify(st))}catch(e){}if(!SB)return;pending=true;clearTimeout(tm);tm=setTimeout(push,700)}
async function push(){try{const r=await fetch(SB_URL+'/rest/v1/app_state',{method:'POST',headers:{...SBH,Prefer:'resolution=merge-duplicates'},body:JSON.stringify([{id:'main',data:st},{id:'bk-'+today,data:st}])});if(!r.ok)throw 0;pending=false}catch(e){toast('บันทึกขึ้นเซิร์ฟเวอร์ไม่สำเร็จ ตรวจอินเทอร์เน็ตหรือไฟล์ config.js')}}
async function pull(first){if(!SB||pending)return;const busy=/INPUT|SELECT|TEXTAREA/.test((document.activeElement||{}).tagName||'');try{const r=await fetch(SB_URL+'/rest/v1/app_state?id=eq.main&select=data',{headers:SBH});if(!r.ok)throw 0;const j=await r.json();const was=conn;conn=true;if(j[0]){const d=j[0].data;if(first||((d._v||0)>(st._v||0)&&!busy)){st=d;fix();render()}else if(!was)render()}else if(first){push();render()}}catch(e){if(conn){conn=false;render()}}}
pull(true);setInterval(()=>pull(false),10000);

const byId=id=>st.emps.find(e=>e.id===id);
const onLeave=(id,d)=>st.leaves.some(l=>l.emp===id&&l.from<=d&&d<=l.to);
const onBan=(id,d)=>st.bans.some(b=>b.emp===id&&b.from<=d&&d<=b.to);const off=(id,d)=>onLeave(id,d)||onBan(id,d);const inGl=(e,g)=>g.some(x=>e.dept.split('/').includes(x));const inGF=(e,k)=>inG(e,k)||inGl(e,S[k].fb||[]);const can=(e,k)=>!(e.no||[]).includes(k);
const active=(e,d)=>e.status!=='off'&&(!e.end||d<e.end);
const inG=(e,k)=>S[k].g.some(g=>e.dept.split('/').includes(g));
const duties=(id,d)=>Object.keys(S).filter(k=>((st.sched[d]||{})[k]||[]).includes(id));
const DN={kid:'ยามเด็กตลาด',gym:'ยามโรงยิม',wash:'ล้างตลาด',rec:'รับแลกขยะ'};KS9.forEach(k=>DN[k]=SH[k[0]].n.split(' ')[0]+' '+S[k].n);
const daysOf=m=>{const[y,mo]=m.split('-').map(Number);const n=new Date(y,mo,0).getDate();return Array.from({length:n},(_,i)=>m+'-'+String(i+1).padStart(2,'0'))};
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2500)}
function cf(k,fn){if(armed[k]){armed={};fn()}else{armed[k]=1;toast('กดอีกครั้งเพื่อยืนยัน');setTimeout(()=>armed={},4000)}}
function go(t){tab=t;ef=null;render()}
function add(d,k,id){if(!id)return;(st.sched[d]=st.sched[d]||{})[k]=[...((st.sched[d]||{})[k]||[]),id];save();render()}
function rm(d,k,id){st.sched[d][k]=st.sched[d][k].filter(x=>x!==id);save();render()}
function cell(d,k){const ids=(st.sched[d]||{})[k]||[];
const chips=ids.map(id=>{const e=byId(id);if(!e)return'';const lv=onLeave(id,d),bn=onBan(id,d);return`<span class="chip ${lv?'red':bn?'ban':''}">${esc(e.name)}${lv?' (ลา)':bn?' (งด)':''}<b onclick="rm('${d}','${k}','${id}')">×</b></span>`}).join('');
const opts=st.emps.filter(e=>inGF(e,k)&&active(e,d)&&!off(e.id,d)&&can(e,k)&&!ids.includes(e.id)).map(e=>`<option value="${e.id}">${duties(e.id,d).length?'':'🟢 '}${esc(e.name)}</option>`).join('');
return`<td>${S[k].post?`<select class="hs" onchange="setHead('${d}','${k}',this.value)"><option value="">👑 เลือกหัวหน้า</option>${(st.hl[k[1]]||[]).map(h=>`<option value="${esc(h)}" ${((st.hd[d]||{})[k])==h?'selected':''}>👑 หัวหน้า: ${esc(h)}</option>`).join('')}</select>`:''}${chips}<select onchange="add('${d}','${k}',this.value)"><option value="">+ เพิ่มชื่อ</option>${opts}</select></td>`}
function bar(withN){return`<div class="bar"><label>เดือน<input type="month" value="${month}" onchange="month=this.value||month;render()"></label>${withN?`<label>คนต่อช่อง<input type="number" min="1" max="20" value="${perSlot}" style="width:70px" onchange="perSlot=Math.max(1,+this.value||1)"></label>`:''}${tab=='duty'?['T','N','H'].map(p=>`<label>หัวหน้า${PO[p][0]} (คั่นด้วย ,)<input id="hl${p}" value="${esc((st.hl[p]||[]).join(', '))}" style="min-width:170px" onchange="saveHl()"></label>`).join(''):''}${tab=='kid'?`<label>แม่บ้านแคมป์2 (คน/วัน)<input type="number" min="0" max="20" value="${st.kidA||3}" style="width:70px" onchange="st.kidA=Math.max(0,+this.value||0);save()"></label><label>DC Camp (คน/วัน)<input type="number" min="0" max="20" value="${st.kidB||2}" style="width:70px" onchange="st.kidB=Math.max(0,+this.value||0);save()"></label>`:''}<button class="b p" onclick="cf('auto',auto)">⚡ จัดเวรอัตโนมัติ</button><button class="b" onclick="exp()">Export Excel</button><button class="b" onclick="try{window.print()}catch(e){toast('เปิดหน้าพิมพ์ไม่ได้ในมุมมองนี้')}">Print</button></div>`}
function setHead(d,k,v){(st.hd[d]=st.hd[d]||{})[k]=v;save();render()}
function saveHl(){['T','N','H'].forEach(p=>{st.hl[p]=$('#hl'+p).value.split(',').map(x=>x.trim()).filter(Boolean)});save();render();toast('บันทึกรายชื่อหัวหน้าแล้ว')}
function hol(d){const i=st.holidays.indexOf(d);if(i<0)st.holidays.push(d);else{st.holidays.splice(i,1);delete st.hnames[d]}save();render()}
function addHol(){const d=$('#h_d').value;if(!d)return toast('เลือกวันที่ก่อน');if(!st.holidays.includes(d))st.holidays.push(d);st.hnames[d]=$('#h_n').value.trim();save();render();toast('เพิ่มวันหยุดแล้ว')}
function holTab(){const ls=[...st.holidays].sort();return`<h2>วันหยุดบริษัท</h2><div class="bar np"><label>วันที่<input type="date" id="h_d" value="${today}"></label><label>ชื่อวันหยุด<input id="h_n" placeholder="เช่น วันปีใหม่" style="min-width:200px"></label><button class="b p" onclick="addHol()">เพิ่มวันหยุด</button></div><div class="w"><table><tr><th>วันที่</th><th>ชื่อวันหยุด</th><th class="np"></th></tr>${ls.map(d=>`<tr class="hd"><td class="d">${fmt(d)}<small>${TH[dow(d)]}</small></td><td>${esc(st.hnames[d]||'-')}</td><td class="np"><button class="b x" onclick="cf('h${d}',()=>hol('${d}'))">ลบ</button></td></tr>`).join('')||'<tr><td colspan="3">ยังไม่มีวันหยุดบริษัท</td></tr>'}</table></div><p class="np" style="color:var(--mu)">วันอาทิตย์และวันหยุดบริษัทแสดงเป็นสีแดง · วันหยุดบริษัทจะไม่จัดล้างตลาดและรับแลกขยะ</p>`}
function grid(title,ks,note,hdr){const sk=!!S[ks[0]].days,days=daysOf(month).filter(d=>!sk||S[ks[0]].days.includes(dow(d)));
return`<h2>${title}</h2>${bar()}<div class="w"><table${ks.length>3?' style="min-width:1250px"':''}>${hdr||`<tr><th>วันที่</th>${ks.map(k=>`<th>${S[k].n}</th>`).join('')}</tr>`}${days.map(d=>{const w=dow(d),h=st.holidays.includes(d);return`<tr class="${w==0||h?'hd':''}"><td class="d ${d==today?'td':''}">${fmt(d)}<small>${TH[w]}${ks[0]=='wash'?(w==2||w==6?' · ริมโขง':' · ตลาด'):''}${h?' · '+esc(st.hnames[d]||'วันหยุด'):''} <a class="np" style="cursor:pointer;text-decoration:underline" onclick="hol('${d}')">${h?'ยกเลิกหยุด':'ตั้งวันหยุด'}</a></small></td>${h&&sk?`<td colspan="${ks.length}">หยุด</td>`:ks.map(k=>cell(d,k)).join('')}</tr>`}).join('')}</table></div><p class="np" style="color:var(--mu)">${note}</p>`}
const male=e=>e.name.startsWith('ท้าว');
function auto(){const days=daysOf(month),hrs={},hc={};days.forEach(d=>{delete st.sched[d];delete st.hd[d]});
for(const d of days){const w=dow(d),used=new Set();st.sched[d]={};st.hd[d]={};const di=days.indexOf(d);['m','a','e'].forEach((sh,si)=>['T','N','H'].forEach(po=>{const L=st.hl[po]||[];if(L.length)st.hd[d][sh+po]=L[(di+si)%L.length]}));
for(const k of['gym','kid','eT','eN','eH','mN','mH','mT','aT','aN','aH','wash','rec']){const s=S[k];if(s.days&&(!s.days.includes(w)||st.holidays.includes(d)))continue;const q=s.q(w);
const pick=(n,f,grp)=>{const pool=st.emps.filter(e=>active(e,d)&&!off(e.id,d)&&can(e,k)&&!used.has(e.id)&&(grp?inGl(e,grp):inG(e,k))&&(!f||f(e)));
pool.sort((x,y)=>((hrs[x.id]||0)-(hrs[y.id]||0))||Math.random()-.5);
return pool.slice(0,n).map(e=>{used.add(e.id);hrs[e.id]=(hrs[e.id]||0)+s.h;return e.id})};
const need=s.qg?s.qg().reduce((a,x)=>a+x[1],0):q.length==1?q[0]:q[0]+q[1];
let ids=s.qg?s.qg().flatMap(([g,n])=>pick(n,e=>e.dept.split('/').includes(g))):q.length==1?pick(q[0]):[...pick(q[0],e=>!male(e)),...pick(q[1],male)];
if(ids.length<need&&s.fb)ids=[...ids,...pick(need-ids.length,null,s.fb)];
if(ids.length<need&&s.qg&&k!='kid')ids=[...ids,...pick(need-ids.length)];
st.sched[d][k]=ids}}
save();render();toast('จัดเวรเดือนนี้เรียบร้อย')}
function ot(id){let n=0,h=0;daysOf(month).forEach(d=>duties(id,d).forEach(k=>{n++;h+=S[k].h}));return[n,h]}
function fair(){const a=st.emps.filter(e=>active(e,month+'-01')).map(e=>ot(e.id)[1]);return Math.max(...a)?'โอทีเดือนนี้ ต่ำสุด '+Math.min(...a)+' · สูงสุด '+Math.max(...a)+' ชม./คน':'ยังไม่ได้จัดเวรเดือนนี้'}

function ov(){const act=st.emps.filter(e=>active(e,fd)),sc=st.sched[fd]||{},nm=ids=>(ids||[]).map(i=>(byId(i)||{}).name).filter(Boolean).join(', ');

function stats(id){let n=0,h=0,hd=0,lv=0;daysOf(month).forEach(d=>{const du=duties(id,d);n+=du.length;du.forEach(k=>h+=S[k].h);if(du.length&&(dow(d)==0||st.holidays.includes(d)))hd+=du.length;if(onLeave(id,d))lv++});return{n,h,hd,lv}}
function statTable(){const L=st.emps.map(e=>({e,...stats(e.id)})).filter(x=>x.e.status!=='off'||x.n);if(!L.length)return'';
const act=L.filter(x=>active(x.e,month+'-01')),avg=act.reduce((a,x)=>a+x.h,0)/(act.length||1),mx=Math.max(1,...L.map(x=>x.h)),hs=act.map(x=>x.h);L.sort((a,b)=>b.h-a.h);
return`<h2 style="margin-top:20px">สถิติรายคน เดือน ${month}</h2><p style="color:var(--mu)">${avg?'ค่าเฉลี่ย '+avg.toFixed(1)+' ชม./คน · ต่ำสุด '+Math.min(...hs)+' · สูงสุด '+Math.max(...hs)+' · วันหยุด = วันอาทิตย์ + วันหยุดบริษัท':'ยังไม่ได้จัดเวรเดือนนี้'}</p><div class="w"><table><tr><th>ชื่อ</th><th>กลุ่ม</th><th>รอบโอที</th><th>ชั่วโมง</th><th style="min-width:160px">เทียบกับค่าเฉลี่ย</th><th>เวรวันหยุด (รอบ)</th><th>ลา (วัน)</th></tr>${L.map(x=>{const d=x.h-avg,c=!avg?'':d>avg*.15?'red':d<-avg*.15?'grn':'';return`<tr><td>${esc(x.e.name)}</td><td>${esc(x.e.dept.split('/').join(', '))}</td><td>${x.n}</td><td>${x.h}</td><td><div style="height:8px;border-radius:4px;background:var(--ch);margin-bottom:3px"><div style="height:8px;border-radius:4px;width:${x.h/mx*100}%;background:var(--pr)"></div></div>${avg?`<span class="tag ${c}">${d>0?'+':''}${d.toFixed(1)} ชม.</span>`:''}</td><td>${x.hd}</td><td>${x.lv}</td></tr>`}).join('')}</table></div>`}
