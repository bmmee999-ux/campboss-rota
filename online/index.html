.chip.ban,.tag.ban,.card.ban,tr.ban td,tr.hd .chip.ban{background:var(--bn);color:var(--bt)}

<script>
const R=[
['โอนเนอร์','นางอำไพ#ปลดเดือน 12/2026#2026-12-01,นางชมพู,นางวิไลลัก,นางลุ่น,นางเพ็ดมะนี,นางมุก,นางน้อย ทำมะวง#ลาคลอด##off,นางนาตาลี,นางตาตุ่น,นางต๋อกๆ,นางวันทิดา#ถือพา,นางจักสุก2,นางวิไลวอน,นางคำม่วน 1,นางลินทอง,นางวิไลพอน,นางคำม่วน 2,นางปานิตา,นางพอนทิบ#ปลดเดือน 12/2026#2026-12-01,นางมาลี,นางละหา#ปลดเดือน 12/2026#2026-12-01'],
['แคมป์2','นางแพงสี,นางเฮียง,นางมี,นางบัวพัน,นางมี้น,นางแอ,นางไมสี,นางทองสี,นางบุนนาก,นางกุ้งนาง,นางนางนี,นางน้ำหนื่ง,นางเพ็ดสะหมอน,นางตา สีหานาม,นางยุ้ย,นางลัก'],

['DC GB','ท้าวสุก,ท้าวสุลิวัน,ท้าวพาด,ท้าวโฟ่โด้,ท้าวสายสะหมอน,ท้าวทองขัน,ท้าวทองพัน,ท้าวสายทอง,ท้าวบุนทะวี GB,ท้าวบุนค้ำ,ท้าวแสงจะเลีน,ท้าวสุพิน,ท้าววันไช,ท้าวเต,ท้าวอุไท,ท้าวสมลัด'],
['แคมป์1','นางแต้ง,นางอำคา,นางคำหล้า,นางเลไล,นางกอน,นางบุนบาง,นางจอน,นางสีดา,นางแพง,นางจันสุก 1,นางต้อม,นางนุ้ย,นางปี่']];
const D=R.map(r=>r[0]);
const SH={m:{n:'กะเช้า (6:00-13:00)',g:['แคมป์2','แคมป์1'],h:7},a:{n:'กะบ่าย (13:00-20:00)',g:['โอนเนอร์','แคมป์1'],h:7},e:{n:'กะเย็น (16:00-22:00)',g:['DC Camp','DC GB'],h:6}};
const PO={T:['ด่านตลาด',2],N:['ด่านนาสั้ง',2],H:['ด่านห้วยย้อ',1]};
const S={kid:{n:'รายชื่อพนักงาน (15:30-18:00)',g:['แคมป์2','DC Camp'],h:2.5,q:()=>[0],qg:()=>[['แคมป์2',st.kidA||3],['DC Camp',st.kidB||2]]},gym:{n:'พนักงานประจำ (17:00-22:00)',g:['DC Camp'],h:5,q:()=>[1]},wash:{n:'รายชื่อพนักงาน',g:['โอนเนอร์','DC GB','แคมป์1'],h:2,days:[1,2,3,5,6],q:()=>[9,4]},rec:{n:'รายชื่อพนักงาน',g:['โอนเนอร์','แคมป์2','DC Camp','แคมป์1'],h:1,days:[1,2,3,4,5],q:w=>({1:[9,6],2:[7,4],3:[9,6],4:[9,6],5:[4,3]})[w]}};
const GR={mT:['แคมป์1'],mN:['แคมป์2'],mH:['แคมป์2'],aT:['โอนเนอร์','แคมป์1'],aN:['โอนเนอร์','แคมป์2'],aH:['โอนเนอร์','แคมป์2'],eT:['DC GB'],eN:['DC Camp','DC GB'],eH:['DC Camp','DC GB']};
const KS9=[];for(const sh in SH)for(const p in PO){S[sh+p]={n:PO[p][0],g:GR[sh+p],h:SH[sh].h,q:()=>[PO[p][1]],post:1,sh:sh};KS9.push(sh+p)}
S.mT.fb=['แคมป์2'];S.aT.qg=()=>[['โอนเนอร์',1],['แคมป์1',1]];
const HDR='<tr><th rowspan="2">วันที่</th>'+Object.values(SH).map(x=>'<th colspan="3">'+x.n+'</th>').join('')+'</tr><tr>'+Object.values(PO).map(x=>'<th class="h2">'+x[0]+'</th>').join('').repeat(3)+'</tr>';
const TH=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const TABS=[['ov','ภาพรวม'],['duty','เวรด่าน'],['gym','ยามโรงยิม'],['kid','ยามเด็กตลาด'],['wash','ล้างตลาด'],['rec','รับแลกขยะ'],['emp','พนักงาน'],['lv','วันลาพัก'],['ban','งดเวร'],['hol','วันหยุดบริษัท'],['hist','สถิติย้อนหลัง']];
const $=s=>document.querySelector(s);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dow=d=>new Date(d+'T00:00').getDay();
const fmt=d=>d.slice(8)+'/'+d.slice(5,7)+'/'+d.slice(0,4);
const today=iso(new Date());
let tab='ov',month=today.slice(0,7),perSlot=3,fd=today,ef=null,armed={},DB=null,tm;
function def(){const m=new Map();R.forEach(([g,s])=>s.split(',').forEach(x=>{const[n,note,end,off]=x.split('#');let e=m.get(n);if(!e){e={id:'e'+(m.size+1),code:'E'+String(m.size+1).padStart(3,'0'),name:n,dept:g,phone:'',status:off?'off':'on',note:note||'',end:end||''};m.set(n,e)}else e.dept+='/'+g}));return{emps:[...m.values()],leaves:[],sched:{}}}
function load(){try{const j=localStorage.getItem('rota');if(j)return JSON.parse(j)}catch(e){}return def()}
const DEFHL={T:['พอนทิบ','คำวิไล','ทิดาพอน'],N:['เสาแก้ว'],H:['สมสัก'],W:['พอนทิบ','คำวิไล','ทิดาพอน','เสาแก้ว'],R:{1:['สมยอด','น้อยนิ','เวียงสะหวัน','แก้วมะนี'],2:['สมยอด','น้อยนิ','บุนมี'],3:['สมยอด','น้อยนิ','เวียงสะหวัน','บุนมี'],4:['สมยอด','น้อยนิ','เวียงสะหวัน','บุนมี'],5:['แก้วมะนี']}};
function fixHl(){if(!st.hl||Array.isArray(st.hl))st.hl=JSON.parse(JSON.stringify(DEFHL));if(!st.hl.W)st.hl.W=[...DEFHL.W];if(!st.hl.R)st.hl.R=JSON.parse(JSON.stringify(DEFHL.R));st.bans=st.bans||[];st.kidA=st.kidA||3;st.kidB=st.kidB||2;st.stats=st.stats||{};st.subs=st.subs||[]}
let st=load();st.holidays=st.holidays||[];st.hnames=st.hnames||{};st.hd=st.hd||{};fixHl();
const SB_URL=String((window.CONFIG||{}).URL||'').replace(/\s+/g,'').replace(/\/rest\/v1\/?$/i,'').replace(/\/+$/,''),SB_KEY=String((window.CONFIG||{}).KEY||'').replace(/[\s'"]+/g,'');
const cfgErr=!SB_URL?'ยังไม่ได้ใส่ URL ใน config.js':!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(SB_URL)?'URL ใน config.js ไม่ถูกรูปแบบ (ต้องเป็น https://รหัส.supabase.co)':!/^[A-Za-z0-9._-]{40,}$/.test(SB_KEY)?'KEY ใน config.js ยังไม่ถูกต้อง: ต้องวาง anon public key (ขึ้นต้น eyJ...) ที่คัดลอกจาก Supabase ทับข้อความตัวอย่าง':'';
const SB=!cfgErr;
const SBH={apikey:SB_KEY,'Content-Type':'application/json'};if(SB_KEY.startsWith('eyJ'))SBH.Authorization='Bearer '+SB_KEY;
async function probe(){const host=SB_URL.replace(/^https:\/\//,'');if(typeof navigator!=='undefined'&&navigator.onLine===false)return'ไม่มีสัญญาณอินเทอร์เน็ต';
try{await fetch(SB_URL+'/rest/v1/',{mode:'no-cors'});return'ติดต่อ '+host+' ได้ แต่ถูกปฏิเสธ — ตรวจ KEY ใน config.js (ต้องเป็น anon public key เต็มสาย)'}
catch(e){return'เข้า '+host+' ไม่ได้ — URL ผิดตัวอักษร / โปรเจกต์ถูกพัก (Paused) ใน Supabase / เครือข่ายบล็อก supabase.co'}}
const HM={401:'key ไม่ถูกต้องหรือหมดอายุ (ตรวจ KEY ใน config.js)',403:'ไม่มีสิทธิ์เขียนตาราง (รัน setup.sql ครบหรือยัง)',404:'ไม่พบตาราง app_state (ยังไม่ได้รัน setup.sql)',413:'ข้อมูลใหญ่เกินไป',429:'ส่งข้อมูลถี่เกินไป รอสักครู่'};
async function sbFetch(u,o){let r;try{r=await fetch(u,o)}catch(e){throw new Error(await probe())}
if(!r.ok){let t='';try{t=(await r.text()).slice(0,100)}catch(e){}throw new Error('HTTP '+r.status+' '+(HM[r.status]||'')+(t&&!HM[r.status]?' — '+t:''))}return r}
async function remoteGet(){const r=await sbFetch(SB_URL+'/rest/v1/app_state?id=eq.main&select=data',{headers:SBH});const j=await r.json();return j[0]?j[0].data:null}
async function remoteSet(o){await sbFetch(SB_URL+'/rest/v1/app_state',{method:'POST',headers:{...SBH,Prefer:'resolution=merge-duplicates'},body:JSON.stringify([{id:'main',data:o},{id:'bk-'+today,data:o}])})}
const canRemote=()=>SB;

// ===== ระบบบันทึก: การแก้ไขเป็น "ร่าง" ในเครื่องนี้ จนกว่าจะกด 💾 บันทึก =====
let dirty=false,baseStr='',baseV=0,remoteNewer=false,lastSaved='',histM='',conn=false,lastErr='',everLoaded=false;
const PINREQ=((window.CONFIG||{}).PIN||'').trim();
const norm=()=>{st.holidays=st.holidays||[];st.hnames=st.hnames||{};st.hd=st.hd||{};fixHl()};
baseStr=JSON.stringify(st);baseV=st._v||0;
if(window.addEventListener)window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
function readDraft(){try{const d=JSON.parse(localStorage.getItem('rota_draft')||'null');return d&&d.st?d:null}catch(e){return null}}
function save(){dirty=true;try{localStorage.setItem('rota_draft',JSON.stringify({baseV,st}))}catch(e){}paintSave()}
function paintSave(){const e=$('#svb');if(!e)return;
e.innerHTML=dirty?`${PINREQ?'<input id="pin" type="password" placeholder="รหัสบันทึก" style="width:96px;padding:4px 8px;border-radius:8px;border:0">':''}<button class="sv1" onclick="commit()">💾 บันทึก</button><button onclick="cf('rv',revert)">↩ ยกเลิกการแก้ไข</button><span class="svt">● ยังไม่ได้บันทึก${remoteNewer?' · มีคนบันทึกใหม่กว่า':''}</span>`:`<span class="svt">✓ บันทึกแล้ว${lastSaved?' '+lastSaved:''}</span>`}
function adopt(o,keepDraft){st=o;norm();baseStr=JSON.stringify(st);baseV=st._v||0;dirty=false;remoteNewer=false;if(!keepDraft){try{localStorage.removeItem('rota_draft')}catch(e){}}render()}
async function pull(first){if(!canRemote())return;
try{const o=await remoteGet();conn=true;lastErr='';const fst=first||!everLoaded;everLoaded=true;
if(!o){if(fst&&!dirty)await commit(true);return}
const rv=o._v||0;
if(fst&&dirty){remoteNewer=rv>baseV;paintSave();return}
if(fst){const d=readDraft();adopt(o,true);if(d&&d.baseV===rv){st=d.st;norm();dirty=true;render();toast('กู้คืนร่างที่ยังไม่ได้บันทึกแล้ว')}else{try{localStorage.removeItem('rota_draft')}catch(e){}}return}
if(!dirty){if(rv>baseV&&!/INPUT|SELECT|TEXTAREA/.test((document.activeElement||{}).tagName||''))adopt(o)}
else{const nv=rv>baseV;if(nv!==remoteNewer){remoteNewer=nv;paintSave()}}
}catch(e){const m=(e&&e.message)||'';if(conn||m!==lastErr){conn=false;lastErr=m;render()}}}
async function commit(first){
if(PINREQ&&!first){const v=($('#pin')||{}).value||'';if(v!==PINREQ)return toast('รหัสบันทึกไม่ถูกต้อง')}
try{
if(canRemote()&&!first){const o=await remoteGet();if(o&&(o._v||0)>baseV&&!armed.ov){armed={ov:1};setTimeout(()=>armed={},6000);return toast('มีคนบันทึกใหม่กว่า กดบันทึกอีกครั้งเพื่อบันทึกทับ หรือกดยกเลิกการแก้ไขเพื่อดูของใหม่')}}
const curM=today.slice(0,7);[...new Set(Object.keys(st.sched).map(d=>d.slice(0,7)))].forEach(m=>{const sg=sig(m),cur=st.stats[m];if(!cur||cur.sig!==sg||m>=curM){const x=computeStats(m);x.sig=sg;st.stats[m]=x}});
st._v=Date.now();
if(canRemote())await remoteSet(st);
try{localStorage.setItem('rota',JSON.stringify(st));localStorage.removeItem('rota_draft')}catch(e){}
baseStr=JSON.stringify(st);baseV=st._v;dirty=false;remoteNewer=false;armed={};
lastSaved=new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});paintSave();if(!first)toast('บันทึกเรียบร้อย')
}catch(e){toast('บันทึกไม่สำเร็จ: '+((e&&e.message)||'ตรวจอินเทอร์เน็ตแล้วลองใหม่'))}}
function retryConn(){lastErr='';render();pull(false)}
function revert(){try{st=JSON.parse(baseStr)}catch(e){return}try{localStorage.removeItem('rota_draft')}catch(e){}dirty=false;remoteNewer=false;render();toast('ยกเลิกการแก้ไขแล้ว');pull(false)}

const sc=e=>{const r=rec[e.id]||[];let stk=0;while(r.some(y=>y.n===dn-1-stk))stk++;const wk=r.filter(y=>y.n>=dn-6);const dys=new Set(wk.map(y=>y.n)).size;const same=wk.filter(y=>y.g===gk).length;
const B=(e.no||[]).length>0;return(hrs[e.id]||0)-cm[coh(e)]+(B?BIAS_B:0)+Math.min(CAP,DIV*((cnt[e.id+k]||0)-mc))+(stk>=1?(B?REST_B:REST):0)+(stk>=2?(B?STREAK2_B:STREAK2):0)+Math.max(0,dys-(B?DAYS_B:DAYS))*(B?WDAY_B:WDAY)+same*SAME};
const sm=new Map(pool.map(e=>[e.id,sc(e)]));
pool.sort((x,y)=>(sm.get(x.id)-sm.get(y.id))||Math.random()-.5);
return pool.slice(0,n).map(e=>{used.add(e.id);hrs[e.id]=(hrs[e.id]||0)+s.h;cnt[e.id+k]=(cnt[e.id+k]||0)+1;addRec(e.id,dn,gk);return e.id})};
const need=s.qg?s.qg().reduce((a,x)=>a+x[1],0):q.length==1?q[0]:q[0]+q[1];
